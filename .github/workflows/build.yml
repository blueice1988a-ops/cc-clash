name: Build Cc clash

# 推送 v 开头的标签（例如 v2.0.3）会打包并发布到 Releases；
# 在 Actions 页面手动运行只打包，不发布，安装包在运行结果的 Artifacts 里下载。
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        run: pnpm install
      - name: Prepare
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        run: pnpm prepare --${{ matrix.arch }}
      - name: Build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        run: pnpm build:win --${{ matrix.arch }}
      - name: Add Portable Flag
        run: |
          New-Item -Path "PORTABLE" -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
          }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*setup.exe
            dist/*portable.7z
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        run: pnpm install
      - name: Prepare
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        run: pnpm prepare --${{ matrix.arch }}
      - name: Build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          # 没有苹果开发者证书，使用临时签名（ad-hoc），用户首次打开需要在系统设置里手动允许
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          chmod +x build/pkg-scripts/postinstall build/pkg-scripts/preinstall
          pnpm build:mac --${{ matrix.arch }} -c.mac.identity=-
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Write latest.yml
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version: $version"
            echo "changelog: |"
            sed 's/^/  /' changelog.md
          } > dist/latest.yml
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: changelog.md
